name: example
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: nginx:latest
    container_name: example-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: example-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DOMAIN: https://${BASE_HOST_NAME:-$HOSTNAME}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      SMTP_SECURITY: starttls
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@${BASE_HOST_NAME:-$HOSTNAME}}
      SMTP_FROM_NAME: ${APP_ORG_NAME:-example}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/example:/data:z'
      - './volumes/config/example:/config:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://example-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - example
      - cloudflare

networks:
  example:
    name: example
    external: false
  cloudflare:
    external: true
