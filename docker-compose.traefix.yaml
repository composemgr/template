# nginx proxy address - http://172.17.0.1:59090

name: example
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: example/server:latest
    container_name: example-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: example-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DOMAIN: https://${BASE_HOST_NAME:-$HOSTNAME}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      SMTP_SECURITY: starttls
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@${BASE_HOST_NAME:-$HOSTNAME}}
      SMTP_FROM_NAME: ${APP_ORG_NAME:-example}
    volumes:
      - './volumes/data/example:/data'
      - './volumes/config/example:/config'
    networks:
      - traefix
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefix'
      - 'traefik.http.routers.example-app.entrypoints=http'
      - 'traefik.http.routers.example-app-secure.tls=true'
      - 'traefik.http.routers.example-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.example-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.example-app.middlewares=example-app-https-redirect'
      - 'traefik.http.routers.example-app-secure.entrypoints=https'
      - 'traefik.http.routers.example-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.example-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.example-secure.service=example'
      - 'traefik.http.services.example.loadbalancer.server.port=80'

networks:
  traefix:
    external: true
